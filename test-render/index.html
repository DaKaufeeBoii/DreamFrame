<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0d1117;
        --ink: #e6edf3;
        --accent: #58a6ff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      }
      #title {
        color: var(--ink);
        font-size: 84px;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-shadow: 0 4px 20px rgba(88, 166, 255, 0.4);
      }
      #subtitle {
        color: var(--accent);
        font-size: 36px;
        font-weight: 400;
        margin-top: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2"
      data-width="1920"
      data-height="1080"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="2" data-track-index="0">DreamFrame</h1>
      <h2 id="subtitle" class="clip" data-start="0" data-duration="2" data-track-index="1">Phase 1 Baseline Render</h2>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1, ease: "power2.out" }, 0);
      tl.fromTo("#subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 1, ease: "power2.out" }, 0.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
