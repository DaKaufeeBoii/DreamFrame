<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="nightBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#0f1522"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.45" r="0.45">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#238636" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deskLamp" cx="0.2" cy="0.35" r="0.35">
      <stop offset="0%" stop-color="#ff9933" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff6600" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="1920" height="1080" fill="url(#nightBack)"/>

  <!-- Warm ambient light bar behind monitor -->
  <rect x="520" y="320" width="880" height="380" rx="30" fill="#388bfd" opacity="0.12"/>
  <circle cx="960" cy="500" r="480" fill="url(#screenGlow)"/>

  <!-- Left Desk Lamp Glow -->
  <circle cx="360" cy="480" r="380" fill="url(#deskLamp)"/>

  <!-- Wide Developer Desk Surface -->
  <polygon points="120,740 1800,740 1920,1080 0,1080" fill="#131924"/>
  <line x1="120" y1="740" x2="1800" y2="740" stroke="#253248" stroke-width="6"/>

  <!-- Ultrawide Curved Monitor -->
  <!-- Monitor Stand -->
  <rect x="930" y="620" width="60" height="140" rx="4" fill="#1e2633"/>
  <ellipse cx="960" cy="750" rx="140" ry="24" fill="#2b3648"/>
  <!-- Bezel & Screen -->
  <rect x="540" y="300" width="840" height="360" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="8"/>
  <rect x="560" y="320" width="800" height="320" rx="8" fill="#161b22"/>

  <!-- IDE Code Lines Visualization -->
  <!-- Sidebar -->
  <rect x="560" y="320" width="120" height="320" fill="#0d1117"/>
  <rect x="580" y="340" width="70" height="10" rx="3" fill="#30363d"/>
  <rect x="580" y="360" width="55" height="8" rx="3" fill="#21262d"/>
  <rect x="580" y="375" width="65" height="8" rx="3" fill="#21262d"/>
  <rect x="580" y="390" width="45" height="8" rx="3" fill="#21262d"/>

  <!-- Code window -->
  <!-- Line 1: const windDown = async () => { -->
  <rect x="710" y="350" width="48" height="10" rx="3" fill="#ff7b72"/>
  <rect x="765" y="350" width="90" height="10" rx="3" fill="#79c0ff"/>
  <rect x="862" y="350" width="18" height="10" rx="3" fill="#d2a8ff"/>
  <rect x="888" y="350" width="52" height="10" rx="3" fill="#ff7b72"/>
  <rect x="948" y="350" width="24" height="10" rx="3" fill="#79c0ff"/>

  <!-- Line 2: // Close the laptop. The code is complete. -->
  <rect x="740" y="380" width="280" height="9" rx="3" fill="#8b949e"/>

  <!-- Line 3: await sleep(tonight); -->
  <rect x="740" y="410" width="55" height="10" rx="3" fill="#ff7b72"/>
  <rect x="803" y="410" width="60" height="10" rx="3" fill="#d2a8ff"/>
  <rect x="870" y="410" width="80" height="10" rx="3" fill="#a5d6ff"/>

  <!-- Mechanical Keyboard -->
  <polygon points="680,820 1240,820 1260,940 660,940" fill="#1b2230" stroke="#2d3748" stroke-width="4"/>
  <!-- Key rows glow -->
  <rect x="700" y="835" width="520" height="14" rx="3" fill="#58a6ff" opacity="0.3"/>
  <rect x="695" y="855" width="530" height="14" rx="3" fill="#58a6ff" opacity="0.4"/>
  <rect x="690" y="875" width="540" height="14" rx="3" fill="#58a6ff" opacity="0.35"/>
  <rect x="680" y="900" width="560" height="18" rx="4" fill="#58a6ff" opacity="0.25"/>

  <!-- Mouse & Mousepad -->
  <rect x="600" y="800" width="720" height="180" rx="10" fill="#0d1117" opacity="0.8"/>
  <rect x="1350" y="850" width="70" height="100" rx="28" fill="#242c3d" stroke="#364259" stroke-width="3"/>

  <!-- Warm Mug with Steam -->
  <rect x="420" y="790" width="60" height="75" rx="10" fill="#e6edf3"/>
  <path d="M 480,805 Q 510,815 480,845" stroke="#e6edf3" stroke-width="6" fill="none"/>
  <!-- Steam -->
  <path d="M 440,780 Q 435,750 445,730 Q 455,710 440,690" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M 460,775 Q 465,755 455,735 Q 445,715 460,695" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.25" stroke-linecap="round"/>
</svg>
